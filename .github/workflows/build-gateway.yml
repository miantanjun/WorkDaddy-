name: Build Gateway (Go sidecar)

# 编译 WorkDaddy 的反代网关 sidecar（vendor/wb2api-go）。
#
# ⚠️ 2026-11-02 起：**网关不再单独发 Release**。
#   正式发版走 `v*` 标签 → build-win.yml 会把网关一起编译、打进主 Release 的
#   `wb2api-windows-amd64.zip` 资产（面板「更新网关」就拉这个）。
#   历史遗留的 `gateway-v*` Release 已作废（它们是孤儿资产，没有任何代码在下载）。
#
# 这个 workflow 现在只剩一个用途：**手动触发**，在不动主程序的前提下单独验证
# 网关能不能编过（只出 artifact，不发任何 Release）。
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  GOFLAGS: '-mod=mod'
  CGO_ENABLED: '0'

jobs:
  build:
    name: 编译 wb2api.exe
    runs-on: windows-latest
    defaults:
      run:
        working-directory: vendor/wb2api-go
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 用 go.mod 里钉的版本，不写死 —— 否则大版本升级时 CI 会悄悄跑偏。
      - name: 安装 Go（按 go.mod 版本）
        uses: actions/setup-go@v5
        with:
          go-version-file: vendor/wb2api-go/go.mod
          cache: true
          cache-dependency-path: vendor/wb2api-go/go.sum

      - name: 显示版本
        shell: bash
        run: |
          go version
          echo "--- go.mod ---"
          head -5 go.mod

      - name: 单元测试
        shell: bash
        run: go test ./internal/panel/ -run "TestProbeModel" -v

      - name: 编译
        shell: bash
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o dist/wb2api.exe ./cmd/server
          ls -lh dist/

      # 版本号直接从源码读，避免「CI 版本和二进制里的 appVersion 对不上」。
      - name: 读取源码版本
        id: ver
        shell: bash
        run: |
          APP=$(grep -oE 'appVersion[[:space:]]*=[[:space:]]*"[^"]+"' cmd/server/main.go | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$APP" ]; then
            echo "::error::cmd/server/main.go 里找不到 appVersion"
            exit 1
          fi
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "源码版本: $APP"

      - name: 生成校验文件
        shell: bash
        run: |
          cd dist
          sha256sum wb2api.exe > wb2api.exe.sha256
          cat wb2api.exe.sha256

      - name: 冒烟（--help 能起来就算产物可用）
        shell: bash
        run: |
          ./dist/wb2api.exe -h 2>&1 | head -5

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: wb2api-gateway-${{ steps.ver.outputs.app }}
          path: |
            vendor/wb2api-go/dist/wb2api.exe
            vendor/wb2api-go/dist/wb2api.exe.sha256
          retention-days: 30

      # 不发 Release：正式发版由 build-win.yml 把网关资产挂到主 Release。
      # 需要发布时请发主版本标签（v*），不要再产生 gateway-v* Release。
