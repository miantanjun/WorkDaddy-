name: Build & Verify Windows Setup

# 触发方式（任选其一）：
#   - 推 v* 标签（正式发版，会挂到 GitHub Release —— 内置更新器只认 Release）
#   - 手动触发 workflow_dispatch（指定版本号；同样会挂 Release，方便不擅长打标签时使用）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.2.3），留空则从 scripts/daemon.js 读取'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-verify:
    name: Build Setup.exe + verify
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装固定 Go 工具链
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache: false

      # .cmd 必须是 CRLF，否则 cmd.exe 解析括号块会失败。
      # 这里刻意不用 shell/grep：Git Bash 的 grep 在 Windows 上可能按文本模式读文件、
      # 看不到 CR，导致「明明是 CRLF 却判为 LF」的误报（2026-09-14 v1.2.2 构建即因此失败）。
      # 用 Python 二进制读原始字节做规范化 + 校验，结果才是可靠的地面真相。
      - name: 换行规范化与校验（.cmd 必须纯 CRLF）
        shell: python
        run: |
          import subprocess, sys

          files = subprocess.run(['git', 'ls-files', '*.cmd'],
                                 capture_output=True, text=True, check=True).stdout.split()
          print('受跟踪的 .cmd 共 %d 个' % len(files))
          if not files:
              print('::error::没有找到任何 .cmd 文件（预期至少 10 个）')
              sys.exit(1)

          # 统一成「仅 CRLF」：先归一为 LF，再把 LF 全部转 CRLF（幂等）
          changed = []
          for f in files:
              raw = open(f, 'rb').read()
              norm = raw.replace(b'\r\n', b'\n').replace(b'\r', b'\n').replace(b'\n', b'\r\n')
              if norm != raw:
                  open(f, 'wb').write(norm)
                  changed.append(f)
          print('需要规范化的文件数: %d' % len(changed))
          for f in changed:
              print('  normalized: %s' % f)

          bad = []
          for f in files:
              raw = open(f, 'rb').read()
              crlf = raw.count(b'\r\n')
              lone_lf = raw.count(b'\n') - crlf
              lone_cr = raw.count(b'\r') - crlf
              ok = crlf > 0 and lone_lf == 0 and lone_cr == 0
              print('  %-4s %-45s CRLF=%d 裸LF=%d 裸CR=%d'
                    % ('CRLF' if ok else 'BAD', f, crlf, lone_lf, lone_cr))
              if not ok:
                  bad.append(f)

          if bad:
              for f in bad:
                  print('::error::%s 不是纯 CRLF，无法在 Windows cmd.exe 使用' % f)
              sys.exit(1)
          print('全部 %d 个 .cmd 已确认为纯 CRLF ✓' % len(files))

      - name: 解析版本号
        id: ver
        shell: bash
        run: |
          VER="${{ github.event.inputs.version }}"
          if [ -z "$VER" ]; then
            VER=$(grep -o "DAEMON_VERSION = '[^']*'" scripts/daemon.js | head -1 | cut -d"'" -f2)
          fi
          if [ -z "$VER" ]; then
            echo "::error::无法确定版本号（scripts/daemon.js 里没有 DAEMON_VERSION）"
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "检测到版本: $VER"

      - name: 校验内置资产 builtin（安装包必须包含）
        shell: bash
        run: |
          SRC="scripts/builtin"
          if [ ! -f "$SRC/nebula/theme.json" ] || [ ! -d "$SRC/wallpapers" ]; then
            echo "::error::缺少内置资产 $SRC（需要 nebula/theme.json 和 wallpapers/）"
            exit 1
          fi
          COUNT=$(find "$SRC/wallpapers" -maxdepth 1 -type f -iname '*.webp' | wc -l | tr -d ' ')
          if [ "$COUNT" -lt 1 ]; then
            echo "::error::内置资产没有任何官方壁纸"
            exit 1
          fi
          echo "已校验 builtin 资产：$COUNT 张壁纸"

      - name: 生成 Windows 安装暂存包（仅供 Inno Setup 使用）
        shell: bash
        env:
          WORKDADDY_BUILD_VERSION: ${{ steps.ver.outputs.version }}
        run: bash scripts/build-win-zip.sh

      - name: 安装 Inno Setup
        shell: pwsh
        run: |
          choco upgrade innosetup --version=6.7.1 --allow-downgrade --no-progress --yes
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed with exit code $LASTEXITCODE" }

      - name: 生成 Setup.exe（用户态 Inno Setup 安装包）
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy RemoteSigned `
            -File .\scripts\build-win-installer.ps1 -IsccPath $iscc -Profile workbuddy-cn -Version ${{ steps.ver.outputs.version }}
          if ($LASTEXITCODE -ne 0) { throw "WorkBuddy 助手 Setup build failed with exit code $LASTEXITCODE" }
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy RemoteSigned `
            -File .\scripts\build-win-installer.ps1 -IsccPath $iscc -Profile workbuddy-ai -Version ${{ steps.ver.outputs.version }}
          if ($LASTEXITCODE -ne 0) { throw "WorkBuddy 助手 AI Setup build failed with exit code $LASTEXITCODE" }

      - name: 确认仅保留 Setup.exe 发行产物
        shell: pwsh
        run: |
          $legacyZip = Get-ChildItem -LiteralPath release\windows -Filter '*-win64.zip' -File -ErrorAction SilentlyContinue
          if ($legacyZip) {
            $legacyZip | Remove-Item -Force
          }
          if (Get-ChildItem -LiteralPath release\windows -Filter '*-win64.zip' -File -ErrorAction SilentlyContinue) {
            throw 'Windows 发布目录仍包含旧 ZIP 产物。'
          }

      - name: 列出产物
        shell: bash
        run: ls -lh release/windows/

      - name: 产物完整性自检（verify-win.cmd，纯只读）
        shell: cmd
        run: |
          call scripts\verify-win.cmd

      - name: 生成 Release 说明（含各安装包 SHA-256，作客户端校验兜底）
        shell: pwsh
        run: |
          $lines = @()
          Get-ChildItem -LiteralPath release\windows -Filter '*.exe' -File | Sort-Object Name | ForEach-Object {
            $h = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLower()
            $lines += "SHA256 ($($_.Name)): $h"
          }
          # 注意：必须写成 SHA256 (文件名): <hex> —— 客户端的 parseSha256 按文件名匹配当前 profile，
          # 多资产共用一份说明时不会取错文件。GitHub 也会为资产提供 digest，这里是冗余兜底。
          $lines += ''
          $lines | Out-File -FilePath release\notes-sha.txt -Encoding ascii
          Get-Content release\notes-sha.txt

      - name: 上传产物（仅 Setup.exe）
        uses: actions/upload-artifact@v4
        with:
          name: workbuddy-helper-win64
          path: |
            release/windows/WorkDaddy-Setup-*.exe
            release/windows/WorkDaddy-AI-Setup-*.exe

      # 内置更新器只认 GitHub Release（不认 Actions artifact），因此打 tag 或手动触发都会挂 Release
      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          name: WorkBuddy 助手 ${{ steps.ver.outputs.version }}
          body_path: release/notes-sha.txt
          files: |
            release/windows/WorkDaddy-Setup-*.exe
            release/windows/WorkDaddy-AI-Setup-*.exe
          generate_release_notes: true
